[package]
name = "reth-celo-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Celo node implementation for reth."

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-payload-builder.workspace = true
reth-ethereum-primitives.workspace = true
reth-node-builder.workspace = true
reth-node-api.workspace = true
reth-tracing.workspace = true
reth-provider.workspace = true
reth-transaction-pool.workspace = true
reth-network.workspace = true
reth-evm.workspace = true
reth-rpc.workspace = true
reth-rpc-api.workspace = true
reth-rpc-eth-api.workspace = true
reth-rpc-builder.workspace = true
reth-rpc-server-types.workspace = true
reth-rpc-eth-types.workspace = true
reth-engine-primitives = { workspace = true, features = ["std"] }
reth-celo-chainspec = { path = "../chainspec" }
reth-celo-evm = { path = "../evm" }
reth-celo-consensus = { path = "../consensus" }
reth-celo-forks = { path = "../hardforks" }
reth-node-ethereum.workspace = true

# ethereum
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-rpc-types-engine.workspace = true

# revm
revm.workspace = true

# misc
eyre.workspace = true

[features]
default = []
js-tracer = [
    "reth-node-builder/js-tracer",
    "reth-rpc/js-tracer",
    "reth-rpc-eth-api/js-tracer",
    "reth-rpc-eth-types/js-tracer",
]
test-utils = [
    "reth-node-builder/test-utils",
    "reth-chainspec/test-utils",
    "reth-network/test-utils",
    "reth-ethereum-primitives/test-utils",
    "reth-provider/test-utils",
    "reth-transaction-pool/test-utils",
    "reth-evm/test-utils",
    "reth-celo-evm/test-utils",
]
